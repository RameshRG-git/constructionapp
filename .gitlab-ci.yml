stages:
  - backend
  - frontend

backend-tests:
  stage: backend
  image: python:3.11
  script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -e .[dev]
    - pytest

frontend-tests:
  stage: frontend
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - cd frontend
    - flutter pub get
    - flutter test
